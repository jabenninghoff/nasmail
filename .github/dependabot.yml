# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 17 * * *"
      timezone: "America/Chicago"
    commit-message:
      prefix: "fix" # Alpine updates are fixes

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 17 * * *"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci" # Actions updates are CI changes
